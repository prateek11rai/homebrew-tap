<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Amber / Gold Beer Mug Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glow" cx="15%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glass Highlights -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />
  <rect width="1200" height="380" fill="url(#glow)" rx="16" />

  <!-- Outer Border -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Left Side: Stylized Homebrew Beer Stein Emblem -->
  <g transform="translate(100, 85)">
    <!-- Glow behind emblem -->
    <circle cx="100" cy="105" r="95" fill="#f59e0b" opacity="0.15" filter="blur(20px)" />
    
    <!-- Outer Emblem Circle -->
    <circle cx="100" cy="105" r="90" fill="#0f172a" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="100" cy="105" r="82" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Homebrew Mug Group -->
    <g transform="translate(42, 38)">
      <!-- Handle -->
      <path d="M 85 45 C 115 45 115 95 85 95" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M 85 45 C 105 45 105 95 85 95" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

      <!-- Beer Glass Body -->
      <path d="M 25 38 L 30 115 C 31 125 40 132 50 132 L 75 132 C 85 132 94 125 95 115 L 100 38 Z" fill="url(#goldGrad)" />
      
      <!-- Glass Flutes / Grooves -->
      <path d="M 45 52 L 47 118" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 62 52 L 62 120" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 80 52 L 78 118" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Reflection on mug -->
      <path d="M 33 42 L 36 112 C 37 116 41 120 46 120 L 48 120 L 44 42 Z" fill="url(#glassReflection)"/>

      <!-- Frothy Foam Head -->
      <!-- Bottom foam line -->
      <ellipse cx="62" cy="40" rx="42" ry="12" fill="#f8fafc" />
      <!-- Bubbly foam clouds -->
      <circle cx="28" cy="36" r="14" fill="#ffffff" />
      <circle cx="44" cy="26" r="16" fill="#ffffff" />
      <circle cx="62" cy="22" r="18" fill="#ffffff" />
      <circle cx="80" cy="27" r="15" fill="#ffffff" />
      <circle cx="96" cy="36" r="13" fill="#ffffff" />
      
      <!-- Foam details -->
      <circle cx="52" cy="30" r="10" fill="#f1f5f9" />
      <circle cx="72" cy="31" r="9" fill="#f1f5f9" />

      <!-- Small floating froth bubbles -->
      <circle cx="22" cy="18" r="3.5" fill="#fef3c7" opacity="0.8"/>
      <circle cx="34" cy="10" r="2.5" fill="#fef3c7" opacity="0.8"/>
      <circle cx="78" cy="10" r="3" fill="#fef3c7" opacity="0.9"/>
      <circle cx="92" cy="16" r="4" fill="#fef3c7" opacity="0.8"/>
      <circle cx="104" cy="26" r="2" fill="#fef3c7" opacity="0.7"/>
    </g>
  </g>

  <!-- Right Side: Typography & Badges -->
  <g transform="translate(350, 105)">
    <!-- Pill Badge: HOMEBREW TAP -->
    <rect width="168" height="32" rx="16" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#f59e0b"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1.5">HOMEBREW TAP</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      prateek11rai <tspan fill="#64748b">/</tspan> <tspan fill="#fbbf24">tap</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Custom formulas, standalone binary distributions &amp; headless developer agent runtimes
    </text>

    <!-- Meta Tags / Pills Row -->
    <g transform="translate(0, 150)">
      <!-- Tag 1: macOS -->
      <rect x="0" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="41" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">macOS</text>

      <!-- Tag 2: Apple Silicon & Intel -->
      <rect x="92" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="161" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">arm64 &amp; x86_64</text>

      <!-- Tag 3: Verified Checksums -->
      <rect x="240" y="0" width="148" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="314" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Verified SHA-256</text>
    </g>
  </g>
</svg>
