<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="beerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="64" cy="64" r="60" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Beer Mug -->
  <g transform="translate(18, 14)">
    <!-- Handle -->
    <path d="M 62 38 C 86 38 86 78 62 78" fill="none" stroke="url(#beerGold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 62 38 C 78 38 78 78 62 78" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

    <!-- Glass Body -->
    <path d="M 16 32 L 20 94 C 21 102 28 108 36 108 L 56 108 C 64 108 71 102 72 94 L 76 32 Z" fill="url(#beerGold)" />
    
    <!-- Grooves -->
    <path d="M 32 44 L 33 96" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 46 44 L 46 98" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 60 44 L 59 96" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Reflection -->
    <path d="M 22 36 L 25 92 C 26 95 29 98 33 98 L 34 98 L 30 36 Z" fill="url(#glassLight)"/>

    <!-- Froth & Foam Head -->
    <ellipse cx="46" cy="34" rx="34" ry="10" fill="#f8fafc" />
    <circle cx="18" cy="30" r="11" fill="#ffffff" />
    <circle cx="31" cy="22" r="13" fill="#ffffff" />
    <circle cx="46" cy="19" r="14" fill="#ffffff" />
    <circle cx="61" cy="23" r="12" fill="#ffffff" />
    <circle cx="73" cy="30" r="10" fill="#ffffff" />
    
    <circle cx="38" cy="25" r="8" fill="#f1f5f9" />
    <circle cx="54" cy="26" r="7" fill="#f1f5f9" />

    <!-- Tiny Bubbles -->
    <circle cx="14" cy="16" r="3" fill="#fef3c7" opacity="0.8"/>
    <circle cx="23" cy="10" r="2" fill="#fef3c7" opacity="0.8"/>
    <circle cx="59" cy="10" r="2.5" fill="#fef3c7" opacity="0.9"/>
    <circle cx="70" cy="15" r="3" fill="#fef3c7" opacity="0.8"/>
  </g>
</svg>
